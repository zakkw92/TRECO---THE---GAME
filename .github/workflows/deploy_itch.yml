name: "🚀 Deploy TRECO Web to Itch.io"

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

jobs:
  export-and-deploy:
    name: "Export Web & Deploy to Itch.io"
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Godot Export Templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -v -p build/web

      - name: 🎮 Export WebGL Build (HTML5)
        run: |
          godot --headless --export-release "Web" build/web/index.html

      - name: 🌐 Deploy Automático para Itch.io
        uses: josephbmanley/butler-publish-itchio-action@v1.0.3
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
          CHANNEL: html5
          ITCH_USER: ${{ secrets.ITCH_USER || 'zakkw92' }}
          ITCH_GAME: ${{ secrets.ITCH_GAME || 'treco-truco-da-taverna' }}
          PACKAGE: build/web
