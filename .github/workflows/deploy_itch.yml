name: "🚀 Deploy TRECO Web to Itch.io"

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

jobs:
  export-web:
    name: "🎮 Export WebGL Build (HTML5)"
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Godot Export Templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -v -p build/web

      - name: 🛠️ Export Project
        run: |
          godot --headless --export-release "Web" build/web/index.html

      - name: 📤 Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web

  deploy-itch:
    name: "🌐 Deploy para Itch.io via Butler"
    needs: export-web
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Download Web Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build/web

      - name: 📦 Setup Butler CLI
        uses: remarkablegames/setup-butler@v3

      - name: 🚀 Publicar no Itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_USER: ${{ secrets.ITCH_USER || 'simaogui' }}
          ITCH_GAME: ${{ secrets.ITCH_GAME || 'treco-truco-da-taverna' }}
        run: |
          butler push build/web ${ITCH_USER}/${ITCH_GAME}:html5
