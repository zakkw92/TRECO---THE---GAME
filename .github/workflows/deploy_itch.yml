name: "🚀 Deploy TRECO Web to Itch.io"

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

jobs:
  export-and-deploy:
    name: "Export Web & Deploy to Itch.io"
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Godot Export Templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -v -p build/web

      - name: 🎮 Export WebGL Build (HTML5)
        run: |
          godot --headless --export-release "Web" build/web/index.html

      - name: 📦 Instalar Butler CLI Oficial
        run: |
          curl -L -o butler.zip https://broth.itch.ovh/butler/linux-amd64/LATEST/archive/default
          unzip butler.zip -d /usr/local/bin
          chmod +x /usr/local/bin/butler
          butler -V

      - name: 🌐 Deploy Direto para Itch.io via Butler
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_USER: ${{ secrets.ITCH_USER || 'simaogui' }}
          ITCH_GAME: ${{ secrets.ITCH_GAME || 'treco-truco-da-taverna' }}
        run: |
          butler push build/web ${ITCH_USER}/${ITCH_GAME}:html5
